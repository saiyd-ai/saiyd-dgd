[build]
  command = "npm run validate:tracking"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# v25.12-P security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://jojtqlfhmkvdegqbwvtj.supabase.co wss://jojtqlfhmkvdegqbwvtj.supabase.co https://skbvtfgkuiumpeufleef.supabase.co https://api.anthropic.com https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; frame-src 'self' blob: data: https://jojtqlfhmkvdegqbwvtj.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
